[project]
name = "sovereign-agent"
version = "1.4.0"
description = "An executable textbook for learning Zero-Employee Organizations"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Rod Rivera" }]
keywords = ["agents", "governance", "education", "zero-employee-organization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2,<3"]

[project.scripts]
sovereign-agent = "sovereign_agent.cli:main"

[project.urls]
Homepage = "https://github.com/profrodai/sovereign-agent"
Documentation = "https://github.com/profrodai/sovereign-agent/tree/main/book"
Repository = "https://github.com/profrodai/sovereign-agent"
Issues = "https://github.com/profrodai/sovereign-agent/issues"
Changelog = "https://github.com/profrodai/sovereign-agent/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "build>=1.3",
  "mypy>=1.18",
  "pytest>=8",
  "ruff>=0.13",
]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sovereign_agent*", "reference_organizations*"]

[tool.setuptools.package-data]
sovereign_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
  "live: installed provider probes/assignments; excluded from default CI",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
